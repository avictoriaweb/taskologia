<main class="tasks">
  <section class="tasks__container">
    <div class="tasks__header">
      <div class="tasks__intro">
        <img class="tasks__logo" src="images/logo.svg" alt="Логотип">
        <div class="tasks__heading">
          <p class="tasks__label">Taskologia</p>
          <h1 class="tasks__title">Трекер задач</h1>
        </div>
      </div>
      <div class="tasks__counter">Активных: {{ getActiveTasksCount() }}</div>
    </div>
    <form class="tasks__form" (ngSubmit)="addTask()">
      <input type="text" class="tasks__input" name="taskTitle"
             placeholder="Введите новую задачу" [(ngModel)]="taskTitle">
      <button class="tasks__button" >Добавить</button>
    </form>

    <div class="tasks__list">
      @for (task of tasks; track task.id) {
        <div class="task" [class.task_completed]="task.completed">
          <button class="task__status" type="button" (click)="toggleTask(task)">
            @if (task.completed) {
              <img src="images/icons/tick.svg" alt="Tick">
            }
          </button>

          <div class="task__content">
            <p class="task__title">{{task.title}}</p>
            @if (task.completed) {
            <span class="task__badge">Выполнено</span>} @else {
              <span class="task__badge task__badge_active">В работе</span>
            }

          </div>

          <button class="task__delete" type="button" (click)="deleteTask(task.id)">
            <img src="images/icons/cross.svg" alt="Cross">
          </button>
        </div>
      } @empty {
        <div class="tasks__empty">
          <p>Задач пока нет</p>
          <span>Добавьте первую задачу через форму выше</span>
        </div>
      }

    </div>

  </section>
</main>
